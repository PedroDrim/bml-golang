name: Run Docker with Tests (Go)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests with Go
    runs-on: ubuntu-latest

    steps:
      - name: 🚗 Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'  # Defina a versão do Go que você está utilizando

      - name: 🧪 Executar testes
        run: go test -cover ./... >> test-results.xml


      - name: 📤 Upload da cobertura de testes
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-de-testes
          path: 'test-results.xml'  # Caminho para os resultados de cobertura

  docker:
    name: 🐳 Build & Run Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 🚀 Checkout do código
        uses: actions/checkout@v4

      - name: 🏗️ Build da imagem Docker
        run: docker compose up --build -d

      - name: 🏃 Rodar o container
        run: docker compose run --rm benchmark | tee benchmark_output.log

      - name: 📤 Publicar resultado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: benchmark_output.log      
      
      - name: 🔻 Derrubar containers no final
        if: always()
        run: docker compose down
